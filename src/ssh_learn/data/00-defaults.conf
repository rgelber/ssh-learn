# Managed by ssh-learn. Reinstalling overwrites this file; put personal
# overrides in ~/.ssh/config (they win, because they are read first).

Host *
    # Keep idle sessions alive and detect dead peers.
    ServerAliveInterval 60
    ServerAliveCountMax 3
    TCPKeepAlive yes
    ConnectTimeout 15

    # Multiplex connections: repeat SSH/scp to the same host is instant.
    ControlMaster auto
    ControlPath ~/.ssh/control/%C
    ControlPersist 10m

    # Remember decrypted keys in the agent (and macOS keychain, if present).
    AddKeysToAgent yes
    IgnoreUnknown UseKeychain
    UseKeychain yes

    HashKnownHosts yes
